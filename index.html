<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descodificados - Matrix Lock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0e27;
            font-family: 'Courier New', monospace;
            position: relative;
        }

        /* Gradiente animado de fundo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(0, 217, 255, 0.1) 0%, rgba(10, 14, 39, 0) 70%);
            animation: pulseGradient 4s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes pulseGradient {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Efeito scanline */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 217, 255, 0.03) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 217, 255, 0.03) 3px
            );
            pointer-events: none;
            z-index: 5;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #gridCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .text-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(8, 22, 36, 0.92);
            padding: 20px 50px;
            border-radius: 8px;
            border: 2px solid rgba(0, 217, 255, 0.6);
            box-shadow:
                0 0 40px rgba(0, 217, 255, 0.5),
                inset 0 0 30px rgba(0, 217, 255, 0.1);
            animation: statusGlow 3s ease-in-out infinite;
            min-width: 400px;
            text-align: center;
        }

        .status-text {
            color: #00d9ff;
            font-family: 'Consolas', 'Courier New', 'Lucida Console', monospace;
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 1px;
            white-space: nowrap;
            text-shadow:
                0 0 10px rgba(0, 217, 255, 1),
                0 0 20px rgba(0, 217, 255, 0.8),
                0 0 30px rgba(0, 217, 255, 0.6),
                0 0 40px rgba(0, 180, 255, 0.4);
            margin: 8px 0;
        }

        .status-text.typing::after {
            content: '█';
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }

        @keyframes statusGlow {
            0%, 100% {
                border-color: rgba(0, 217, 255, 0.6);
                box-shadow:
                    0 0 40px rgba(0, 217, 255, 0.5),
                    inset 0 0 30px rgba(0, 217, 255, 0.1);
            }
            50% {
                border-color: rgba(0, 217, 255, 0.9);
                box-shadow:
                    0 0 60px rgba(0, 217, 255, 0.7),
                    inset 0 0 40px rgba(0, 217, 255, 0.2);
            }
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .text-container {
                min-width: auto;
                max-width: 90%;
                padding: 15px 25px;
            }
            .status-text {
                font-size: 18px;
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <canvas id="gridCanvas"></canvas>
    <canvas id="matrixCanvas"></canvas>

    <div class="content">
        <div class="text-container">
            <div class="status-text" id="line1"></div>
            <div class="status-text" id="line2"></div>
        </div>
    </div>

    <script>
        // ========== GRID FUTURISTA ==========
        const gridCanvas = document.getElementById('gridCanvas');
        const gridCtx = gridCanvas.getContext('2d');
        gridCanvas.width = window.innerWidth;
        gridCanvas.height = window.innerHeight;

        function drawGrid() {
            const gridSize = 50;
            gridCtx.strokeStyle = 'rgba(0, 217, 255, 0.1)';
            gridCtx.lineWidth = 1;

            for (let x = 0; x < gridCanvas.width; x += gridSize) {
                gridCtx.beginPath();
                gridCtx.moveTo(x, 0);
                gridCtx.lineTo(x, gridCanvas.height);
                gridCtx.stroke();
            }

            for (let y = 0; y < gridCanvas.height; y += gridSize) {
                gridCtx.beginPath();
                gridCtx.moveTo(0, y);
                gridCtx.lineTo(gridCanvas.width, y);
                gridCtx.stroke();
            }

            gridCtx.strokeStyle = 'rgba(0, 217, 255, 0.2)';
            gridCtx.lineWidth = 2;

            const centerX = gridCanvas.width / 2;
            const centerY = gridCanvas.height / 2;

            gridCtx.beginPath();
            gridCtx.moveTo(centerX, 0);
            gridCtx.lineTo(centerX, gridCanvas.height);
            gridCtx.stroke();

            gridCtx.beginPath();
            gridCtx.moveTo(0, centerY);
            gridCtx.lineTo(gridCanvas.width, centerY);
            gridCtx.stroke();
        }

        drawGrid();

        // ========== EFEITO MATRIX ==========
        const matrixCanvas = document.getElementById('matrixCanvas');
        const matrixCtx = matrixCanvas.getContext('2d');
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;

        const katakana = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
        const alphabet = katakana + latin + nums + symbols;

        const fontSize = 16;
        const columns = matrixCanvas.width / fontSize;

        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = Math.random() * -100;
        }

        function drawMatrix() {
            matrixCtx.fillStyle = 'rgba(10, 14, 39, 0.05)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

            matrixCtx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));

                const brightness = Math.random();
                if (brightness > 0.95) {
                    matrixCtx.fillStyle = '#00d9ff';
                } else if (brightness > 0.7) {
                    matrixCtx.fillStyle = '#00b4d8';
                } else {
                    matrixCtx.fillStyle = '#0096c7';
                }

                const x = i * fontSize;
                const y = drops[i] * fontSize;

                matrixCtx.fillText(text, x, y);

                if (y > matrixCanvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i]++;
            }
        }

        // ========== ANIMAÇÃO PRINCIPAL ==========
        let matrixFrameCount = 0;
        function animate() {
            // Matrix roda a cada 2 frames para melhor performance
            if (matrixFrameCount % 2 === 0) {
                drawMatrix();
            }
            matrixFrameCount++;

            requestAnimationFrame(animate);
        }

        animate();

        // ========== EFEITO DE DIGITAÇÃO (TYPEWRITER) ==========
        const line1 = document.getElementById('line1');
        const line2 = document.getElementById('line2');
        const message1 = 'O Código do Novo Digital';
        const message2 = 'está sendo Descodificado';
        let typingSpeed = 100;
        let currentLine = 1;
        let charIndex = 0;

        function typeWriter() {
            if (currentLine === 1) {
                // Digitando primeira linha
                if (charIndex < message1.length) {
                    line1.textContent = message1.substring(0, charIndex + 1);
                    charIndex++;
                    if (!line1.classList.contains('typing')) {
                        line1.classList.add('typing');
                    }
                    setTimeout(typeWriter, typingSpeed);
                } else {
                    // Primeira linha completa, remove cursor e vai para segunda
                    line1.classList.remove('typing');
                    currentLine = 2;
                    charIndex = 0;
                    setTimeout(typeWriter, 300);
                }
            } else if (currentLine === 2) {
                // Digitando segunda linha
                if (charIndex < message2.length) {
                    line2.textContent = message2.substring(0, charIndex + 1);
                    charIndex++;
                    if (!line2.classList.contains('typing')) {
                        line2.classList.add('typing');
                    }
                    setTimeout(typeWriter, typingSpeed);
                } else {
                    // Segunda linha completa, pausa e reinicia
                    line2.classList.remove('typing');
                    setTimeout(() => {
                        line1.textContent = '';
                        line2.textContent = '';
                        currentLine = 1;
                        charIndex = 0;
                        typeWriter();
                    }, 3000);
                }
            }
        }

        // Inicia o efeito de digitação
        typeWriter();

        // ========== RESIZE ==========
        window.addEventListener('resize', () => {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            gridCanvas.width = window.innerWidth;
            gridCanvas.height = window.innerHeight;
            drawGrid();
        });
    </script>
</body>
</html>
