        // Clipboard function compatible with iframes

        let toastTimeout;
        function showToast(message = 'Código copiado!') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }
        async function copyText(text, message = 'Código copiado!') {
            try {
                try { await navigator.clipboard.writeText(text); }
                catch {
                    const focused = document.activeElement;
                    const field = document.createElement('textarea');
                    field.value = text;
                    field.setAttribute('readonly', '');
                    field.style.cssText = 'position:fixed;top:0;left:-9999px;font-size:16px';
                    document.body.appendChild(field);
                    field.select();
                    field.setSelectionRange(0, field.value.length);
                    let copied;
                    try { copied = document.execCommand('copy'); }
                    finally { field.remove(); focused?.focus(); }
                    if (!copied) throw new Error('Clipboard unavailable');
                }
                showToast(message);
            } catch { window.prompt('Copie o código abaixo:', text); }

            const filtered = codesData.filter(item => 
                normalize(item.name).includes(term) || 
                normalize(item.desc).includes(term) || item.code.toLowerCase().includes(term)
            );
            renderGrid(filtered);
        });

        // Botão Mágico - Sorteia e copia uma combinação surpresa
        async function generateMagic() {
            const combo = magicCombinations[Math.floor(Math.random() * magicCombinations.length)];
            await copyText(combo, 'Combinação Mágica Copiada! Cole para ver.');
        }
    </script>
</body>
